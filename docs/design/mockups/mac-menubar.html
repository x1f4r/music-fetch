<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Music Fetch — macOS — Menu bar extra</title>
<link rel="stylesheet" href="mac.css">
<script>if (location.hash === '#dark') document.documentElement.dataset.theme = 'dark';</script>
<style>
  body.compact { background: linear-gradient(160deg, var(--desk-a), var(--desk-b)); }
  .mbwin .recent-card { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding: 10px 8px; border-top: .5px solid var(--sep); }
  .mbwin .recent-card .text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
</style>
</head>
<body class="compact">
<div class="menubar">
  <span class="extra"><span class="ic ic-hum"></span></span>
  <span class="ic ic-search s14" style="opacity:.8"></span>
  <span>Tue 13 Oct&nbsp; 14:32</span>
</div>
<div class="mbwin">
  <div class="listen">
    <div class="glass"></div>
    <svg class="mark" width="40" height="18" viewBox="0 0 48 20" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11 C7 11 8 5 12 5 C16 5 17 15 21 15 C26 15 26 3 31 3 C36 3 36 13 40 13 C43 13 44 9 45 9"/>
    </svg>
  </div>
  <div class="state">Identify what's playing</div>
  <div class="sources toggle-row">
    <div class="toggle on"><span class="ic ic-mic s12"></span>Microphone</div>
    <div class="toggle"><span class="ic ic-laptop s12"></span>This Mac</div>
    <div class="toggle"><span class="ic ic-hum s12"></span>Hum</div>
  </div>
  <div class="recent-card">
    <div class="art art-40 cv-houdini"></div>
    <div class="text">
      <div class="headline truncate">Houdini</div>
      <div class="callout secondary truncate">Dua Lipa</div>
    </div>
    <div class="btn">Open in Spotify</div>
  </div>
  <div class="mb-foot">
    <span>Open Music Fetch</span>
    <span class="ic ic-gear" style="color:var(--label2)"></span>
  </div>
</div>
</body>
</html>
