<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Music Fetch — Android — Hum (live pitch trace)</title>
<link rel="stylesheet" href="android.css">
<script src="mock.js"></script>
<script>if (location.hash === '#dark') document.documentElement.dataset.theme = 'dark';</script>
<style>
  .listen .halo { opacity: .28; }
  .trace-band svg { width: 100%; height: 100%; color: var(--primary); overflow: visible; }
  .listen svg.ring { position: absolute; inset: -14px; width: 188px; height: 188px; overflow: visible; }
  .sources { opacity: .45; }
</style>
</head>
<body>
<div class="statusbar"><span>14:32</span><span class="cam"></span><span class="right"><span class="ic ic-wifi s18"></span><span class="sigbars"><i style="height:4px"></i><i style="height:7px"></i><i style="height:10px"></i><i style="height:12px"></i></span><span class="battery"></span></span></div>

<div class="searchbar"><span class="ic ic-link"></span><span class="ph">Paste a link</span><span class="ic ic-attach"></span></div>

<div class="stage">
  <div class="trace-band"><svg id="trace" viewBox="0 0 364 96" preserveAspectRatio="none"></svg></div>
  <div class="listen">
    <div class="halo"></div>
    <svg class="ring" viewBox="0 0 188 188">
      <circle cx="94" cy="94" r="86" fill="none" stroke="var(--surface-container-highest)" stroke-width="4"/>
      <path id="ringfill" fill="none" stroke="var(--primary)" stroke-width="4" stroke-linecap="round"/>
    </svg>
    <svg class="shape" viewBox="0 0 160 160"><path id="shape" fill="var(--primary)"/></svg>
    <svg class="mark" width="76" height="44" viewBox="0 0 64 40" fill="none" stroke="var(--on-primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path id="wave"/>
    </svg>
  </div>
  <div class="state active">Keep going</div>
  <div class="sources">
    <div class="bgroup">
      <div class="tglbtn"><span class="ic ic-mic s20"></span>Microphone</div>
      <div class="tglbtn"><span class="ic ic-phone s20"></span>Phone</div>
      <div class="tglbtn on"><span class="ic ic-hum s20"></span>Hum</div>
    </div>
  </div>
  <div class="recent">
    <div class="art art-56 cv-houdini"></div>
    <div class="text">
      <div class="title-m truncate">Houdini</div>
      <div class="body-m variant truncate">Dua Lipa · 14:32</div>
    </div>
    <span class="ic ic-chev-right variant"></span>
  </div>
</div>

<nav class="navbar">
  <div class="navitem on"><div class="pill"><span class="ic ic-listen"></span></div>Listen</div>
  <div class="navitem"><div class="pill"><span class="ic ic-library-o"></span></div>Library</div>
</nav>
<div class="navhandle"></div>
<script>
  document.getElementById('shape').setAttribute('d', Mock.scallopPath(80, 80, 70, 9, .07, -Math.PI / 2));
  document.getElementById('wave').setAttribute('d', Mock.wavePath(64, 40, .35, 5));
  Mock.drawTrace(document.getElementById('trace'), Mock.MELODY, { w: 364, h: 96, t1: 7.4 - 8, t2: 7.4, width: 4, nowDot: 4, seed: 11 });
  document.getElementById('ringfill').setAttribute('d', Mock.wavyArc(94, 94, 86, 2, 18, 7.4 / 12));
</script>
</body>
</html>
