<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Music Fetch — macOS — Settings › Melody</title>
<link rel="stylesheet" href="mac.css">
<script>if (location.hash === '#dark') document.documentElement.dataset.theme = 'dark';</script>
</head>
<body class="settings">
<div class="swin">
  <div class="lights"><i></i><i></i><i></i></div>
  <div class="wt">Melody</div>
  <div class="settings-tabs">
    <div class="stab"><span class="ic ic-gear"></span>General</div>
    <div class="stab"><span class="ic ic-key"></span>Services</div>
    <div class="stab on"><span class="ic ic-hum"></span>Melody</div>
    <div class="stab"><span class="ic ic-drive"></span>Storage</div>
    <div class="stab"><span class="ic ic-info"></span>About</div>
  </div>
  <div class="form">
    <div class="group">
      <div class="frow"><span class="k">Melody library</span><span class="v">41,234 songs · 48 MB</span></div>
      <div class="frow"><span class="k">Updated</span><span class="v">October 1, 2026</span></div>
      <div class="frow"><span class="k"></span><span class="v"><span class="btn">Check for Updates</span><span class="btn">Remove</span></span></div>
    </div>
    <div class="gfoot">Needed to recognize humming, whistling and singing. Stays on this Mac.</div>

    <div class="ghead">While humming</div>
    <div class="group">
      <div class="frow"><span class="k">Also search lyrics you sing</span><span class="v"><span class="switch on"></span></span></div>
      <div class="frow"><span class="k">Stop automatically after a pause</span><span class="v"><span class="switch on"></span></span></div>
    </div>
  </div>
</div>
</body>
</html>
