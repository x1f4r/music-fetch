<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Music Fetch — macOS — Hum (live pitch trace)</title>
<link rel="stylesheet" href="mac.css">
<script src="mock.js"></script>
<script>if (location.hash === '#dark') document.documentElement.dataset.theme = 'dark';</script>
<style>
  .listen .halo { opacity: .32; transform: scale(1.05); }
  .trace-band svg { width: 100%; height: 100%; color: var(--accent); overflow: visible; }
  .listen .ring svg { position: absolute; inset: 0; overflow: visible; }
</style>
</head>
<body>
<div class="window">
  <aside class="panel sidebar">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="sb-toggle"><span class="ic ic-sidebar"></span></div>
    <div class="sb-item selected"><span class="ic ic-hum"></span>Listen</div>
    <div class="sb-item"><span class="ic ic-stack"></span>Library</div>
    <div class="sb-section">Pinned</div>
    <div class="sb-item"><span class="ic ic-mix"></span><span class="truncate">Fred again.. | Boiler Room: London</span></div>
    <div class="sb-item"><span class="ic ic-note"></span><span class="truncate">Nights</span></div>
  </aside>

  <main class="content">
    <div class="toolbar">
      <div class="tb-left"><span class="wtitle">Listen</span></div>
      <div class="tb-field"><span class="ic ic-link s14"></span>Paste a link</div>
      <div class="tb-right"><div class="tb-group"><div class="tb-btn"><span class="ic ic-sidebar"></span></div></div></div>
    </div>
    <div class="pane">
      <div class="stage">
        <div class="trace-band"><svg id="trace" viewBox="0 0 560 96"></svg></div>
        <div class="listen">
          <div class="halo"></div>
          <div class="ring"><svg viewBox="0 0 124 124"><circle cx="62" cy="62" r="61" fill="none" stroke="var(--label4)" stroke-width="1.5"/><path id="ringfill" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round"/></svg></div>
          <div class="glass"></div>
          <svg class="mark" width="64" height="40" viewBox="0 0 64 40" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path id="wave"/>
          </svg>
        </div>
        <div class="state active">Keep going</div>
        <div class="sources toggle-row dim">
          <div class="toggle"><span class="ic ic-mic s14"></span>Microphone</div>
          <div class="toggle"><span class="ic ic-laptop s14"></span>This Mac</div>
          <div class="toggle on"><span class="ic ic-hum s14"></span>Hum</div>
        </div>
        <div class="recent row">
          <div class="art art-40 cv-houdini"></div>
          <div class="text">
            <div class="headline truncate">Houdini</div>
            <div class="callout secondary truncate">Dua Lipa</div>
          </div>
          <div class="trail"><span class="callout mono">14:32</span><div class="btn">Open in Spotify</div></div>
        </div>
      </div>
    </div>
  </main>
</div>
<script>
  document.getElementById('wave').setAttribute('d', Mock.wavePath(64, 40, .35, 5));
  Mock.drawTrace(document.getElementById('trace'), Mock.MELODY, { w: 560, h: 96, t1: 7.4 - 8, t2: 7.4, width: 4, nowDot: 4, seed: 11 });
  // 12 s hum ring at 7.4 s
  const f = 7.4 / 12, a = -Math.PI / 2, b = a + 2 * Math.PI * f, r = 61, cx = 62, cy = 62;
  document.getElementById('ringfill').setAttribute('d', `M${cx + r * Math.cos(a)} ${cy + r * Math.sin(a)} A${r} ${r} 0 ${f > .5 ? 1 : 0} 1 ${cx + r * Math.cos(b)} ${cy + r * Math.sin(b)}`);
</script>
</body>
</html>
