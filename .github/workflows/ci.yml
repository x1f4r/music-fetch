name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Engine (Rust)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        working-directory: core
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: core
      - name: Format
        working-directory: core
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: core
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        working-directory: core
        run: cargo test --workspace

  android:
    name: Android app
    runs-on: ubuntu-24.04
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.14206865
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.13"
      - name: Toolchain
        working-directory: core
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: android
      - name: cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build (unsigned release)
        env:
          MF_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
        run: scripts/build-android-app.sh --unsigned
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  macos:
    name: macOS app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        working-directory: core
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: apple
      - name: XcodeGen
        run: |
          xcodebuild -version
          brew install xcodegen
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/build-macos-app.sh
      - name: Verify signature
        run: |
          codesign --verify --deep --strict "dist/Music Fetch.app"
          codesign -dvvv -r- "dist/Music Fetch.app" 2>&1 | grep 'designated => identifier "local.musicfetch.app"'
      - uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: dist/*.zip
          if-no-files-found: error

  privacy:
    name: Privacy and secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --no-banner --redact --config .gitleaks.toml --source .
