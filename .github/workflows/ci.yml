name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Engine (Rust)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        working-directory: core
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: core
      - name: Format
        working-directory: core
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: core
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        working-directory: core
        run: cargo test --workspace

  wasm:
    name: Engine (wasm32 and feature subsets)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        working-directory: core
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: wasm
      - name: Check (wasm32, net)
        working-directory: core
        run: cargo check -p mfcore --target wasm32-unknown-unknown --no-default-features --features net
      - name: Clippy (wasm32, net; std clocks banned)
        working-directory: core
        run: cargo clippy -p mfcore --target wasm32-unknown-unknown --no-default-features --features net -- -D warnings
      - name: Tests (pure core, no default features)
        working-directory: core
        run: cargo test -p mfcore --no-default-features
      - name: Check (engine without UniFFI)
        working-directory: core
        run: cargo check -p mfcore --all-targets --no-default-features --features engine
      # SQLite (store) is C: it needs a clang that targets wasm32 and llvm-ar.
      - name: LLVM for wasm32
        run: echo "/usr/lib/llvm-18/bin" >> "$GITHUB_PATH"
      - name: Clippy (wasm32, net, store, decode and the browser tests)
        working-directory: core
        run: >-
          cargo clippy -p mfcore --target wasm32-unknown-unknown --no-default-features
          --features net,store,decode --lib --test wasm_store --test wasm_decode -- -D warnings
      - name: Clippy (wasm32, the whole engine and its browser facade)
        working-directory: core
        run: cargo clippy -p mfcore-wasm --target wasm32-unknown-unknown --tests -- -D warnings
      - name: wasm-bindgen test runner
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Tests (wasm32 in Node)
        working-directory: core
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
        run: |
          cargo test -p mfcore --target wasm32-unknown-unknown --no-default-features --features store,decode --test wasm_decode
          cargo test -p mfcore-wasm --target wasm32-unknown-unknown --profile wasm-dev --test api
      - name: Browser engine module and a live session in Node
        working-directory: core
        run: |
          crates/mfcore-wasm/build.sh --dev --no-opt
          node crates/mfcore-wasm/smoke/live-smoke.mjs
      - name: Tests (wasm32 in Chrome and Firefox Workers)
        working-directory: core
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          WASM_BINDGEN_USE_DEDICATED_WORKER: "1"
          WASM_BINDGEN_TEST_TIMEOUT: "300"
        run: |
          for driver in "CHROMEDRIVER=$CHROMEWEBDRIVER/chromedriver" "GECKODRIVER=$GECKOWEBDRIVER/geckodriver"; do
            echo "== $driver"
            env "$driver" cargo test -p mfcore --target wasm32-unknown-unknown --no-default-features \
              --features store,decode --test wasm_store --test wasm_decode
            env "$driver" cargo test -p mfcore-wasm --target wasm32-unknown-unknown --profile wasm-dev --test api
          done

  android:
    name: Android app
    runs-on: ubuntu-24.04
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.14206865
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.13"
      - name: Toolchain
        working-directory: core
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: android
      - name: cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build (unsigned release)
        env:
          MF_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
        run: scripts/build-android-app.sh --unsigned
      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  macos:
    name: macOS app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        working-directory: core
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: apple
      - name: XcodeGen
        run: |
          xcodebuild -version
          brew install xcodegen
      - name: Build
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/build-macos-app.sh
      - name: Verify signature
        run: |
          codesign --verify --deep --strict "dist/Music Fetch.app"
          codesign -dvvv -r- "dist/Music Fetch.app" 2>&1 | grep 'designated => identifier "local.musicfetch.app"'
      - uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: dist/*.zip
          if-no-files-found: error

  extension:
    name: Browser extension
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: extension
    env:
      # Pinned like the Legion's: Chrome for Testing (branded Chrome can't load unpacked
      # extensions) and Firefox release.
      CHROME_VERSION: "155.0.8059.84"
      FIREFOX_VERSION: "158.0"
      BROWSERS_DIR: ${{ github.workspace }}/.browsers
      SCREENS_SCALE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Dependencies
        run: npm ci
      - uses: actions/cache@v6
        with:
          path: .browsers
          key: browsers-chrome-${{ env.CHROME_VERSION }}-firefox-${{ env.FIREFOX_VERSION }}
      - name: Browsers
        run: |
          npx @puppeteer/browsers install "chrome@$CHROME_VERSION" --path "$BROWSERS_DIR" >/dev/null
          npx @puppeteer/browsers install "firefox@stable_$FIREFOX_VERSION" --path "$BROWSERS_DIR" >/dev/null
          echo "CHROMIUM_BIN=$BROWSERS_DIR/chrome/linux-$CHROME_VERSION/chrome-linux64/chrome" >> "$GITHUB_ENV"
          echo "FIREFOX_BIN=$(find "$BROWSERS_DIR/firefox" -maxdepth 3 -type f -name firefox | head -1)" >> "$GITHUB_ENV"
      # The e2e pages play synthetic songs: tab capture needs an output device, so a null sink.
      - name: Display and audio
        run: |
          # Chrome for Testing's sandbox needs unprivileged user namespaces (AppArmor blocks them on 24.04).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb pulseaudio >/dev/null
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=mf_ci >/dev/null
          echo "PULSE_SINK=mf_ci" >> "$GITHUB_ENV"
      - name: Types and unit tests
        run: tests/ci/run.sh check unit
      - name: Build
        run: tests/ci/run.sh build
      - name: web-ext lint
        run: tests/ci/run.sh lint
      - name: Demo states, accessibility and the Firefox layout
        run: tests/ci/run.sh screens
      - name: End to end (headful on Xvfb)
        run: xvfb-run -a --server-args="-screen 0 1600x1000x24" tests/ci/run.sh e2e runtime
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: extension-artifacts
          path: |
            extension/.e2e-artifacts
            extension/.screens/a11y.json
            extension/.screens/firefox.json
          if-no-files-found: ignore

  privacy:
    name: Privacy and secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --no-banner --redact --config .gitleaks.toml --source .
