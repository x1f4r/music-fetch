[package]
name = "opus-decoder"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Pure-Rust Opus decoder (opus-decoder 0.1.1 with its debug file logging disabled)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TadeuszWolfGang/Rusopus"
publish = false

[lib]
name = "opus_decoder"
path = "src/lib.rs"

[dependencies]
thiserror = "2.0.18"

[lints.rust]
# Upstream code, kept as published apart from the patch.
warnings = "allow"
