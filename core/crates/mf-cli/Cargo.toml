[package]
name = "mf-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "mf"
path = "src/main.rs"

[dependencies]
mfcore = { path = "../mfcore" }
tokio = { workspace = true, features = ["rt-multi-thread", "time", "process", "io-util", "fs", "net"] }
serde_json.workspace = true
sha2 = "0.11"
serde.workspace = true
parking_lot = "0.12"
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
# media
ctrlc = "3.4"
# shazam, stub recognizer
base64 = "0.23"
url = "2.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
