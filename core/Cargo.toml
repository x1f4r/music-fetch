[workspace]
resolver = "3"
members = ["crates/mfcore", "crates/mf-cli", "crates/uniffi-bindgen"]
# Patched third-party sources (see vendor/opus-decoder/VENDORED.md), not workspace crates.
exclude = ["vendor"]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"
repository = "https://github.com/x1f4r/music-fetch"

[workspace.dependencies]
uniffi = { version = "=0.32.2" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "fs", "net"] }
tracing = "0.1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

# Development and evaluation builds (`--profile release-fast`): release optimizations
# with parallel codegen and no LTO, several times faster to build. Shipping builds use
# `release`.
[profile.release-fast]
inherits = "release"
codegen-units = 16
lto = false

[profile.dev.package."*"]
opt-level = 2

# opus-decoder 0.1.1 as published writes developer debug logs to a hard-coded path
# while decoding; the vendored copy is identical except that those writes are disabled.
[patch.crates-io]
opus-decoder = { path = "vendor/opus-decoder" }
