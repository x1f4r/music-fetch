[workspace]
resolver = "3"
members = ["crates/mfcore", "crates/mf-cli", "crates/uniffi-bindgen"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"
repository = "https://github.com/x1f4r/music-fetch"

[workspace.dependencies]
uniffi = { version = "=0.32.2" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "fs"] }
tracing = "0.1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2
