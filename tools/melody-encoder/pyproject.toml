[project]
name = "melody-encoder"
version = "0.1.0"
description = "Learned melody window encoder for hum retrieval: data, training, evaluation, export"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faiss-cpu>=1.9",
    "numpy>=2.1",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "scipy>=1.14",
    "soundfile>=0.12",
    "torch>=2.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["melenc"]

# CUDA wheels on Linux (the GPU host); the default PyPI build elsewhere.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
