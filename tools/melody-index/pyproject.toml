[project]
name = "melody-index"
version = "1.0.0"
description = "Offline builder for the Music Fetch melody index (JSONL input for `mf index build`)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "mido>=1.3",
    "numpy>=2.1",
    "pretty-midi>=0.2.10",
    "rapidfuzz>=3.10",
    "requests>=2.32",
    "scipy>=1.14",
    "setuptools<81",
    "soundfile>=0.12",
    "torch>=2.6",
]

[project.scripts]
mfidx = "melody_index.cli:main"

[dependency-groups]
dev = ["librosa>=0.11", "pytest>=8.3"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["melody_index"]

# CUDA wheels on Linux (the GPU host); the default PyPI build elsewhere.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
