# Secret scanning for scripts/privacy-check.sh and CI.
[extend]
useDefault = true

[allowlist]
description = "Known non-secrets in test fixtures"
regexTarget = "match"
regexes = [
  # YouTube page-internal entity keys in saved watch-page fixtures.
  '''(?i)(EntityKey|key)"\s*:\s*"E[hi][A-Za-z0-9%_=+/-]+"''',
  # Dummy ACRCloud credentials used by unit tests.
  '''a1b2c3d4e5f6a7b8''',
]
